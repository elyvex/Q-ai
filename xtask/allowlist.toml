# Q-ai dependency-direction allowlist for `cargo xtask arch-check`.
# Enforced in CI (AC-P0-02). Source of truth: docs/03-plan/phases/phase-00-foundation/readme.md §6.
#
# Semantics:
#   workspace.allow   = workspace crates whose EDGE to this crate is legal.
#   external.allow    = (reserved) external crates permitted; unused for now.
#   workspace.deny    = workspace crates that MUST NOT be depended on (fail-closed even if allow empty).
#
# A crate NOT listed here is treated as "allow = []", i.e. it must have no workspace
# dependencies at all (this catches accidental coupling from newly-added crates).
[domain]
workspace = { allow = [] }

[application]
workspace = { allow = ["domain", "storage", "storage-sqlite", "provenance", "audit", "jobs", "sources", "config", "observability", "quran-core", "quran-corpus", "citations", "tools", "tool-registry"] }

[storage]
workspace = { allow = ["domain"] }

[storage-sqlite]
workspace = { allow = ["storage", "domain", "quran-core"] }

[provenance]
workspace = { allow = ["domain", "storage"] }

[audit]
workspace = { allow = ["domain", "storage"] }

[jobs]
workspace = { allow = ["domain", "storage", "observability"] }

[sources]
workspace = { allow = ["domain", "storage", "provenance"] }

[cli]
workspace = { allow = ["application", "config", "observability", "server"] }

[server]
workspace = { allow = ["application", "config", "observability"] }

[observability]
workspace = { allow = [] }

# testkit is a dev-only fixture crate. It legitimately reuses domain/config/storage
# types to build fixtures, and never ships in a binary (dev-dependency only).
[testkit]
workspace = { allow = ["domain", "config", "storage", "audit", "sources", "jobs", "provenance", "observability"] }

[xtask]
workspace = { allow = [] }

# --- Phase 1 (Canonical Quran Core) ---
# quran-core is a pure domain crate: types + reference grammar + QuranQuotation.
# Hard rule I2: it may depend only on {domain, serde, thiserror} (+ Unicode crates).
# It must never depend on llm/embeddings/retrieval or any vector store.
[quran-core]
workspace = { allow = ["domain"] }

# quran-corpus: intermediate format, adapters, tokenizer, validator, differ, importer logic.
# Same I2 prohibition applies (no llm/embeddings/retrieval/vector store).
[quran-corpus]
workspace = { allow = ["quran-core", "domain", "sources", "storage"] }

# citations: citation resolver v1, deep links, verify_quotation.
[citations]
workspace = { allow = ["quran-core", "domain"] }

# tools: ToolResult contract + reproducibility data (D1.8).
[tools]
workspace = { allow = ["quran-core", "domain"] }

# tool-registry: minimal local registry wiring the first two read-only tools.
[tool-registry]
workspace = { allow = ["tools"] }
