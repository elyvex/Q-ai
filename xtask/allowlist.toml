# Q-ai dependency-direction allowlist for `cargo xtask arch-check`.
# Enforced in CI (AC-P0-02). Source of truth: docs/03-plan/phases/phase-00-foundation/readme.md §6.
#
# Semantics:
#   workspace.allow            = workspace crates whose EDGE to this crate is legal.
#   external.registry.allow    = registry (crates.io) crates this crate may depend on.
#   external.git.allow         = git-source crates this crate may depend on (empty unless explicitly justified).
#   workspace.deny             = workspace crates that MUST NOT be depended on (fail-closed even if allow empty).
#
# A crate with no `external` section (or an empty allow list) may use no
# external edge of that class — fail closed. The registry lists in the
# FND-07 block below are derived from current `cargo metadata --all-features`
# output; adding a new external dependency requires naming it there first.
#
# A crate NOT listed here is treated as "allow = []", i.e. it must have no workspace
# dependencies at all (this catches accidental coupling from newly-added crates).
[domain]
workspace = { allow = [] }

[application]
workspace = { allow = ["domain", "storage", "storage-sqlite", "provenance", "audit", "jobs", "sources", "config", "observability", "quran-core", "quran-corpus", "quran-normalization", "quran-search", "quran-morphology", "quran-graph", "citations", "tools", "tool-registry"] }

[storage]
workspace = { allow = ["domain"] }

[storage-sqlite]
workspace = { allow = ["storage", "domain", "quran-core"] }

[provenance]
workspace = { allow = ["domain", "storage"] }

[audit]
workspace = { allow = ["domain", "storage"] }

[jobs]
workspace = { allow = ["domain", "storage", "observability"] }

[sources]
workspace = { allow = ["domain", "storage", "provenance"] }

[cli]
workspace = { allow = ["application", "config", "observability", "server"] }

[server]
# `server` is the HTTP interface layer. OD-14 accepts `server -> storage` +
# `tools` direct calls under this allowlist (A5: enforced by `arch-check` in
# CI, not just review); trait seams are required at every such call site so
# the Phase-3 routing evaluation (candidate ADR-0300) stays a wiring change,
# not a refactor. Changing this allow set requires a new OD entry.
workspace = { allow = ["application", "config", "observability", "tool-registry", "tools", "storage", "citations", "quran-core"] }

# --- Phase 5 (Rich Quran Experience) ---
# `tui` is the ratatui/crossterm operations cockpit (D-10/D-13). It reads
# through the shared `application` services layer (D-12) — never HTTP, never
# shelling out — plus the domain/observability/config types those services
# surface. Added with its dependency in the owning allowlist plan (Pitfall 2).
[tui]
workspace = { allow = ["application", "config", "observability", "tools", "tool-registry", "quran-core", "domain"] }

[observability]
workspace = { allow = ["domain"] }

# testkit is a dev-only fixture crate. It legitimately reuses domain/config/storage
# types to build fixtures, and never ships in a binary (dev-dependency only).
[testkit]
workspace = { allow = ["domain", "config", "storage", "audit", "sources", "jobs", "provenance", "observability"] }

[xtask]
workspace = { allow = [] }

# --- Phase 1 (Canonical Quran Core) ---
# quran-core is a pure domain crate: types + reference grammar + QuranQuotation.
# Hard rule I2: it may depend only on {domain, serde, thiserror} (+ Unicode crates).
# It must never depend on llm/embeddings/retrieval or any vector store.
[quran-core]
workspace = { allow = ["domain"] }

# quran-corpus: intermediate format, adapters, tokenizer, validator, differ, importer logic.
# Same I2 prohibition applies (no llm/embeddings/retrieval/vector store).
[quran-corpus]
workspace = { allow = ["quran-core", "domain", "sources", "storage"] }

# citations: citation resolver v1, deep links, verify_quotation.
[citations]
workspace = { allow = ["quran-core", "domain"] }

# tools: ToolResult contract + reproducibility data (D1.8).
[tools]
workspace = { allow = ["quran-core", "domain"] }

# tool-registry: minimal local registry wiring the first two read-only tools.
[tool-registry]
workspace = { allow = ["tools", "quran-core", "domain"] }

# --- Phase 2 (Quran Search, Normalization & Linguistics) ---
# quran-normalization is pure logic: rules, SpanMap, pipeline, profiles, traces.
# It must never depend on llm/embeddings/retrieval or any vector store (AC-P2-36).
[quran-normalization]
workspace = { allow = ["domain"] }

# quran-search: index + query over derived text (FTS5 backend first, DEV-05).
# Same prohibition: no llm/embeddings/retrieval/vector store (AC-P2-36).
[quran-search]
workspace = { allow = ["quran-normalization", "quran-core", "domain", "storage"] }

# quran-morphology: lexicon types, intermediate format, adapters, alignment,
# MV validation, analysis policy, compare, family relations (D2.6–D2.8).
# Pure logic + serde types; no llm/embeddings/retrieval/vector store (AC-P2-36).
[quran-morphology]
workspace = { allow = ["domain", "quran-core"] }

# quran-graph: GraphStore port, traversal, structural projection (D4.1–D4.2).
# No backend query-language leaks; no llm/embeddings/retrieval/vector store.
# The application/storage-sqlite workspace edges below are DEV-ONLY
# (conformance test target constructs the SQLite adapter beside the
# reference backend; testkit precedent). Production code keeps the port
# direction application -> quran-graph.
[quran-graph]
workspace = { allow = ["domain", "quran-core", "application", "storage-sqlite"] }

# --- Phase 1 (FND-07) external dependency policy ---
# Registry/git edges are explicit per crate and fail closed (D-02, D-03).
# Each `external.registry.allow` list is derived from the crate's current
# direct dependencies in `cargo metadata --all-features` output; no package
# was added, installed, or upgraded to produce it. All `external.git.allow`
# lists are empty: the workspace currently has no git-source dependency, so
# any git edge fails until explicitly justified here. A crate with no entry
# in this block (or an empty list) may use no external edge of that class.
[domain.external.registry]
allow = ["proptest", "serde", "serde_json", "thiserror", "time", "uuid"]
[domain.external.git]
allow = []

[application.external.registry]
allow = ["async-trait", "lru", "proptest", "serde", "serde_json", "sqlx", "tempfile", "thiserror", "tokio", "tracing", "unicode-segmentation", "uuid"]
[application.external.git]
allow = []

[storage.external.registry]
allow = ["async-trait", "serde", "serde_json", "thiserror", "tokio"]
[storage.external.git]
allow = []

[storage-sqlite.external.registry]
allow = ["async-trait", "sha2", "sqlx", "tempfile", "thiserror", "time", "tokio", "uuid"]
[storage-sqlite.external.git]
allow = []

[provenance.external.registry]
allow = ["async-trait", "serde", "serde_json", "sha2", "thiserror", "time", "uuid"]
[provenance.external.git]
allow = []

[audit.external.registry]
allow = ["async-trait", "serde", "serde_json", "sha2", "thiserror", "tokio"]
[audit.external.git]
allow = []

[jobs.external.registry]
allow = ["async-trait", "serde", "serde_json", "thiserror", "time", "tokio", "tracing", "uuid"]
[jobs.external.git]
allow = []

[sources.external.registry]
allow = ["async-trait", "base64", "ed25519-dalek", "serde", "serde_json", "sha2", "thiserror", "time", "tokio", "uuid"]
