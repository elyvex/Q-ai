# Rust 1.97 edition, style aligned with the toolchain component above.
# Only stable rustfmt options are used. Nightly-only options are avoided
# so `cargo fmt --check` on stable is clean in CI.
edition = "2024"
tab_spaces = 4
use_small_heuristics = "Max"
reorder_imports = true
newline_style = "Unix"
use_try_shorthand = true
