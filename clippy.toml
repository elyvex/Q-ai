# Phase 0 clippy configuration (D0.1). Tighten over time; never loosen without an ADR.
# Phase 0 invariant: zero `unsafe` workspace-wide (enforced in Cargo.toml `[workspace.lints]`).

# Correctness-helpers we specifically care about for integrity-critical code.
disallowed-methods = []

# Ensure license-header / doc-valid identifiers don't get false positives on domain terms.
doc-valid-idents = ["Quran", "Hadith", "Tafsir", "Uthmani", "Hafs", "Warsh", "Qiraat"]
